const draw=()=>{$("#app").innerHTML=`<div class="card"><h3>🃏 Cocokkan Kartu</h3><p>Langkah: ${mv} · Pasangan: ${got}/6</p><div class="mg">${cs.map((c,k)=>`<button class="cd${c.f?" f":""}${c.m?" m":""}" data-k="${k}">${c.f||c.m?c.t:"?"}</button>`).join("")}</div></div>`;
$(".mg").onclick=e=>{const b=e.target.closest(".cd");if(!b||lock)return;const c=cs[b.dataset.k];if(c.f||c.m)return;c.f=1;op.push(c);
if(op.length===2){mv++;const[x,y]=op;if(x.i===y.i){x.m=y.m=1;x.f=y.f=0;got++;op=[];fx(1)}else{lock=1;draw();setTimeout(()=>{x.f=y.f=0;op=[];lock=0;draw()},900);return}}
draw();if(got===6){const sc=Math.max(10,70-mv*3);addPts(0,sc);S.h.unshift({m:"m",sc});S.h=S.h.slice(0,8);save();$("#app").innerHTML=`<div class="card"><div class="tut">${tuti(1)}<p><b>Semua pasangan ketemu!</b> ${mv} langkah, ${sc} poin.</p></div><button class="btn ac" data-a="pm">Main lagi</button></div>`}}};draw()}
/* ===== AKSI ===== */
const A={mc:()=>$(".mb").remove(),
about:()=>modal("<h3>Tentang stutax.id</h3><p>PajakQuest adalah proyek edukasi pajak untuk pelajar dan mahasiswa. Tujuannya sederhana: belajar PPh 21, 22, 23, dan 24 itu bisa santai, seru, dan tetap akurat.</p>"),
ch:d=>{ch=+d.p;if(location.hash==="#materi")go()},bk:()=>{ch=0;go()},ct:d=>{ct=+d.t;go()},
hit:()=>{const f={};document.querySelectorAll("#cf [name]").forEach(e=>f[e.name]=e.value);const r=CALC[ct](f);
$("#rs").innerHTML=!r?'<p class="card" role="alert">Isi angkanya dengan benar dulu ya.</p>':r.e?`<p class="card" role="alert">${r.e}</p>`:`<div class="card c${ct}"><h3>Hasil: ${rp(r.t)} ${r.u}</h3><ol>${r.st.map(s=>`<li>${s}</li>`).join("")}</ol>${r.x||""}<button class="btn gh" data-a="why">Kenapa begini?</button><p id="why" hidden>${r.w}</p><p class="mu">Dasar hukum: ${r.l}. Hasil untuk belajar, bukan angka resmi.</p></div>`},
why:()=>{$("#why").hidden=!$("#why").hidden},
pk:()=>{const p=+$("#gp").value;start("k",sh(QS.filter(q=>!p||q[0]===p)).slice(0,10))},
pd:()=>start("d",sh(DT).slice(0,8).map(([q,a,e])=>[a,"e",q,[`PPh ${a}`,...[21,22,23,24].filter(x=>x!==a).map(x=>`PPh ${x}`)],e])),
pm:playM,lt:d=>{lb.t=d.v;go()},lf:d=>{lb.f=+d.v;go()},
av:d=>{S.av=d.v;save();go()},pf:()=>{S.name=$("#pn").value.trim().slice(0,16)||"Tamu";save();toast("Profil disimpan");go()}};
A.pk_=A.pk;A.pd_=A.pd;
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t){let a=t.dataset.a;if(t.dataset.again&&a==="pk")return A.pk_?go_k():0;(A[a]||(()=>{}))(t.dataset)}});
function go_k(){start("k",sh(QS).slice(0,10))}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$(".mb"))A.mc()});
$("#th").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dark?"light":"dark";try{localStorage.setItem("pqt",d.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem("pqt");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#upd").textContent=CFG.upd;
function mini(){const q=QS.find(x=>x[0]===ch);ask(q,$("#mq"),ok=>{if(ok&&!S.done.includes(ch)){S.done.push(ch);addPts(ch,20);if(S.done.length===4)award("ch4");toast("Bab selesai! +20 XP")}},mini,0,"Ulangi kuis")}
function go(){clearInterval(TM);const r=(location.hash||"#beranda").slice(1),k=V[r]?r:"beranda";$("#app").innerHTML=V[k]();
document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",a.hash==="#"+k?"page":"false"));if(k==="materi"&&ch)mini();scrollTo(0,0)}
addEventListener("hashchange",()=>{if(location.hash!=="#materi")ch=0;go()});go();
</script>
